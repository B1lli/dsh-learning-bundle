<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">dsh-learning-bundle verified behavior</title>
  <desc id="desc">A terminal-style summary showing candidate recall blocked, explicit adoption, scoped recall, and the observed npm to pnpm output change.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151b31"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1035" cy="90" r="210" fill="#5eead4" opacity="0.06"/>
  <circle cx="155" cy="600" r="250" fill="#818cf8" opacity="0.07"/>
  <g filter="url(#shadow)">
    <rect x="88" y="68" width="1024" height="494" rx="24" fill="#090d18" stroke="#2b3553" stroke-width="2"/>
    <rect x="88" y="68" width="1024" height="58" rx="24" fill="#151b2b"/>
    <rect x="88" y="102" width="1024" height="24" fill="#151b2b"/>
  </g>
  <circle cx="126" cy="97" r="8" fill="#fb7185"/>
  <circle cx="153" cy="97" r="8" fill="#fbbf24"/>
  <circle cx="180" cy="97" r="8" fill="#34d399"/>
  <text x="600" y="104" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">dsh-learning-bundle · rc.8 assembled run</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">
    <text x="130" y="176" fill="#64748b">$</text>
    <text x="164" y="176" fill="#e2e8f0">record correction</text>
    <text x="475" y="176" fill="#fbbf24">candidate</text>
    <text x="805" y="176" fill="#94a3b8">recall 0</text>
    <text x="130" y="230" fill="#64748b">$</text>
    <text x="164" y="230" fill="#e2e8f0">adopt &lt;item-id&gt;</text>
    <text x="475" y="230" fill="#34d399">active</text>
    <text x="805" y="230" fill="#94a3b8">recall 1</text>
    <line x1="130" y1="268" x2="1070" y2="268" stroke="#26304a" stroke-width="2"/>
    <text x="130" y="320" fill="#94a3b8">L− before adoption</text>
    <text x="805" y="320" fill="#f8fafc">npm install</text>
    <text x="130" y="372" fill="#94a3b8">L+ after adoption</text>
    <text x="805" y="372" fill="#5eead4">pnpm install</text>
    <line x1="130" y1="410" x2="1070" y2="410" stroke="#26304a" stroke-width="2"/>
    <text x="130" y="462" fill="#94a3b8">other profile</text>
    <text x="805" y="462" fill="#34d399">0 injections ✓</text>
    <text x="130" y="514" fill="#94a3b8">explicit “use npm”</text>
    <text x="805" y="514" fill="#34d399">npm wins ✓</text>
  </g>
</svg>
